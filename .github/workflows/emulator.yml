name: Emulator screenshots
on:
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to build and test
        default: main
      api:
        description: emulator API level
        default: '35'
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: app
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build debug APK
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: pip install websocket-client
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/.github/emu/run.sh app/android/app/build/outputs/apk/debug/app-debug.apk out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-${{ inputs.api }}-${{ github.run_number }}
          path: out
